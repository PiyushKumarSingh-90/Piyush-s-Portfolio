<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Dark Regal Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121828"/>
      <stop offset="50%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#030408"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6DC"/>
      <stop offset="25%" stop-color="#F3D389"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="90%" stop-color="#B8861B"/>
      <stop offset="100%" stop-color="#805B0D"/>
    </linearGradient>

    <!-- Inner Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5BF73" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E5BF73" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter for 3D Relief -->
    <filter id="goldRelief" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#E5BF73" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Shield (Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  <circle cx="32" cy="32" r="28" fill="url(#centerGlow)"/>

  <!-- Ornate Double Gold Border -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="12.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.95"/>
  <rect x="6.5" y="6.5" width="51" height="51" rx="9.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-opacity="0.45" stroke-dasharray="3 2"/>

  <!-- Four Corner Accent Jewels -->
  <circle cx="8" cy="8" r="1.2" fill="#F3D389"/>
  <circle cx="56" cy="8" r="1.2" fill="#F3D389"/>
  <circle cx="8" cy="56" r="1.2" fill="#F3D389"/>
  <circle cx="56" cy="56" r="1.2" fill="#F3D389"/>

  <!-- Magical Sparkle Star in Top-Right -->
  <path d="M48 9 L49.2 12.8 L53 14 L49.2 15.2 L48 19 L46.8 15.2 L43 14 L46.8 12.8 Z" fill="url(#goldGrad)"/>

  <!-- Monogram PS (Interlocking Regal Vectors) -->
  <g filter="url(#goldRelief)">
    <!-- Letter P -->
    <path d="M15 45.5 V18.5 H26 C32 18.5 35.5 21.5 35.5 26 C35.5 30.5 32 33.5 26 33.5 H20.5 V45.5 H15 Z M20.5 23 V29 H25.5 C28 29 30 28 30 26 C30 24 28 23 25.5 23 Z" fill="url(#goldGrad)"/>
    
    <!-- Letter S (Layered & Interlocking) -->
    <path d="M47 41 C45 44 41.5 45.5 37 45.5 C31 45.5 27 42.5 27 38 C27 34 30.5 32.5 34.5 31.3 L36.5 30.7 C39.5 29.8 41.2 28.8 41.2 26.8 C41.2 24.8 39.2 23.5 36.5 23.5 C33.8 23.5 31.8 24.8 31 26.8 H26.5 C27.5 22.5 31.5 19 36.8 19 C42.2 19 46.2 22.2 46.2 26.8 C46.2 30.5 43.2 32.5 39 33.5 L36.8 34.2 C33.2 35.2 31.5 36.2 31.5 38.2 C31.5 40.2 33.5 41.5 36.8 41.5 C39.5 41.5 42 40.2 43 38.5 Z" fill="url(#goldGrad)" opacity="0.95"/>
  </g>
</svg>